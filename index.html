<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrics Display</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Bad Romance - Lady Gaga</h1>
        <div class="lyrics-display" id="lyricsDisplay">
            Loading lyrics...
        </div>
        <div class="line-counter" id="lineCounter">
            Line 1 of 105
        </div>
        <div class="controls">
            <button id="prevBtn" class="btn">Previous</button>
            <button id="playBtn" class="btn btn-primary">Play</button>
            <button id="nextBtn" class="btn">Next</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
