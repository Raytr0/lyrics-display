<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrics Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #e94560;
            margin-bottom: 30px;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }

        .lyrics-display {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .lyrics-text {
            color: #fff;
            font-size: 1.5rem;
            line-height: 1.6;
            font-weight: 500;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .line-counter {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 35px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-prev, .btn-next {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-prev:hover, .btn-next:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-play {
            background: #e94560;
            color: #fff;
        }

        .btn-play:hover {
            background: #ff6b6b;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }

        .btn-play.playing {
            background: #4ecca3;
        }

        .btn-play.playing:hover {
            background: #5effcc;
            box-shadow: 0 5px 20px rgba(78, 204, 163, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bad Romance</h1>
        <div class="line-counter">
            <span id="currentLine">1</span> / <span id="totalLines">105</span>
        </div>
        <div class="lyrics-display">
            <div class="lyrics-text" id="lyricsText">Loading...</div>
        </div>
        <div class="buttons">
            <button class="btn-prev" id="prevBtn">Previous</button>
            <button class="btn-play" id="playBtn">Play</button>
            <button class="btn-next" id="nextBtn">Next</button>
        </div>
    </div>

            "Roma-roma-ma",
            "Gaga, ooh la-la",
            "Want your bad romance"
        ];

        let currentIndex = 0;
        let isPlaying = false;
        let playInterval = null;

        const lyricsText = document.getElementById('lyricsText');
        const currentLineEl = document.getElementById('currentLine');
        const totalLinesEl = document.getElementById('totalLines');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playBtn = document.getElementById('playBtn');

        function updateDisplay() {
            lyricsText.textContent = lyrics[currentIndex];
            currentLineEl.textContent = currentIndex + 1;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === lyrics.length - 1;
        }

        function nextLine() {
            if (currentIndex < lyrics.length - 1) {
                currentIndex++;
                updateDisplay();
            } else {
                stopPlayback();
            }
        }

        function prevLine() {
            if (currentIndex > 0) {
                currentIndex--;
                updateDisplay();
            }
        }

        function togglePlay() {
            if (isPlaying) {
                stopPlayback();
            } else {
                startPlayback();
            }
        }

        function startPlayback() {
            isPlaying = true;
            playBtn.textContent = 'Stop';
            playBtn.classList.add('playing');

            playInterval = setInterval(() => {
                nextLine();
            }, 2000);
        }

        function stopPlayback() {
            isPlaying = false;
            playBtn.textContent = 'Play';
            playBtn.classList.remove('playing');

            if (playInterval) {
                clearInterval(playInterval);
                playInterval = null;
            }
        }

        prevBtn.addEventListener('click', () => {
            stopPlayback();
            prevLine();
        });

        nextBtn.addEventListener('click', () => {
            stopPlayback();
            nextLine();
        });

        playBtn.addEventListener('click', togglePlay);

        // Initialize
        totalLinesEl.textContent = lyrics.length;
        updateDisplay();
    </script>
</body>
</html>
